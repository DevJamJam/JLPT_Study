name: Public latency diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/measure-public-latency.mjs
      - .github/workflows/latency-diagnostic.yml

permissions:
  contents: read

jobs:
  public-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Measure public GET requests without cookies or secrets
        run: node scripts/measure-public-latency.mjs
